name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  PLUGIN_SLUG: post-to-pdf-for-convertapi

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' "$PLUGIN_SLUG.php" | awk '{print $NF}')
          constant=$(grep -m1 -oP "define\(\s*'PTPDF_VERSION',\s*'\K[^']+" "$PLUGIN_SLUG.php")
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "Tag: $VERSION | Header: $header | PTPDF_VERSION: $constant | Stable tag: $stable"
          status=0
          for v in "$header" "$constant" "$stable"; do
            if [ "$v" != "$VERSION" ]; then status=1; fi
          done
          if [ $status -ne 0 ]; then
            echo "::error::Tag version $VERSION does not match the version in the plugin header, PTPDF_VERSION, or readme.txt Stable tag."
          fi
          exit $status

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Build plugin zip
        run: |
          mkdir -p build/"$PLUGIN_SLUG"
          rsync -a --exclude-from=.distignore --exclude=build ./ build/"$PLUGIN_SLUG"/
          cd build
          zip -r "$PLUGIN_SLUG.zip" "$PLUGIN_SLUG"
          unzip -l "$PLUGIN_SLUG.zip"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          requires_wp=$(grep -m1 -E '^\s*\*\s*Requires at least:' "$PLUGIN_SLUG.php" | awk '{print $NF}')
          requires_php=$(grep -m1 -E '^\s*\*\s*Requires PHP:' "$PLUGIN_SLUG.php" | awk '{print $NF}')
          cat > build/release-notes.md <<EOF
          ## Requirements

          - WordPress ${requires_wp} or later
          - PHP ${requires_php} or later
          - A [ConvertAPI](https://www.convertapi.com/) account and API secret

          ## Installation

          1. Download **\`${PLUGIN_SLUG}.zip\`** from the Assets section below. (Don't use the "Source code" archives; they don't include the required \`vendor/\` dependencies.)
          2. In WordPress, go to **Plugins → Add New Plugin → Upload Plugin**, choose the zip, and click **Install Now**.
          3. Activate **Post to PDF for ConvertAPI**.
          4. Go to **Settings → Post to PDF** and enter your ConvertAPI secret, or define it in \`wp-config.php\`:
             \`\`\`php
             define( 'PTPDF_CONVERTAPI_SECRET', 'your-secret' );
             \`\`\`

          ### Updating

          Once installed, WordPress picks up new releases from this repository automatically and offers them under **Dashboard → Updates**. To update manually, upload the new zip the same way and choose **Replace current with uploaded**.

          EOF
          cat build/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          files: build/${{ env.PLUGIN_SLUG }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
